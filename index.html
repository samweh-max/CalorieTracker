<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F6">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<meta name="description" content="Samslimmer — a friendly calorie, macro and water tracker.">
<title>Samslimmer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samslimmer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Set light/dark before the page draws, so there's no white flash.
  try { var t = (JSON.parse(localStorage.getItem('samslimmer.v1') || '{}').settings || {}).theme || 'auto';
    var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = d ? 'dark' : 'light';
    if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1416'); } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast-root" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Samslimmer needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
