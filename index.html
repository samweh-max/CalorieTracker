<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samstronger</title>
<meta name="apple-mobile-web-app-title" content="Samstronger">
<meta name="application-name" content="Samstronger">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1A1A">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
:root{--ink:#1A1A1A;--paper:#F4EBDD;--card:#FBF6EC;--tile:#E9DFCF;--brick:#C8553D;--brickd:#B0432D;--muted:#5A524A;--gold:#F5B82E;--white:#fff;--sel:#FFF3CF;--ok:#E4EFD9;--line:#D9CDB9;--miss:#F3D5CC;--shadow:#1A1A1A;color-scheme:light}
:root[data-theme=dark]{--ink:#F1E7D8;--paper:#1B1917;--card:#27231F;--tile:#E9DFCF;--muted:#B9AD9C;--white:#131110;--sel:#4B3C14;--ok:#24391E;--line:#4A433B;--miss:#4E241B;--shadow:#000;color-scheme:dark}
[data-theme=dark] header,[data-theme=dark] .stage2,[data-theme=dark] .stage,[data-theme=dark] .mpic,[data-theme=dark] .th,[data-theme=dark] .hfig,[data-theme=dark] .isl,[data-theme=dark] .pht{--ink:#1A1A1A;--paper:#F4EBDD;--card:#FBF6EC;--muted:#5A524A;--white:#fff;--line:#D9CDB9;--sel:#FFF3CF;--ok:#E4EFD9;color:var(--ink)}
[data-theme=dark] header{background:#0E0C0B;color:#F4EBDD;border-bottom:2px solid #F5B82E}
[data-theme=dark] header .pbtn,[data-theme=dark] header #back{border-color:#F4EBDD;color:#F4EBDD}
[data-theme=dark] .isl{background:#F4EBDD;border-radius:8px;padding:8px}
[data-theme=dark] .fig.isl{padding:6px 4px 0}
[data-theme=dark] .rest{background:#0E0C0B;color:#F4EBDD;border:2px solid var(--line)}
[data-theme=dark] .rest button{border-color:#F4EBDD;color:#F4EBDD}
[data-theme=dark] .shbg{background:rgba(0,0,0,.7)}
[data-theme=dark] .ptag,[data-theme=dark] .tag.g,[data-theme=dark] .tk.on,[data-theme=dark] .sel>.tk,[data-theme=dark] .wc.today,[data-theme=dark] .wc.today small,[data-theme=dark] .st.go,[data-theme=dark] .st.go small{color:#1A1A1A}
[data-theme=dark] .ptag.dn,[data-theme=dark] .ptag.sk,[data-theme=dark] .wrow.dn .tk{color:#fff}
[data-theme=dark] .st.go{background:#F5B82E}
[data-theme=dark] .lnk,[data-theme=dark] .chip.rm,[data-theme=dark] .rmx,[data-theme=dark] .kgh button,[data-theme=dark] .pex em,[data-theme=dark] .vsr .ar.d{color:#F0907A;border-color:#F0907A}
[data-theme=dark] .vsr .ar.u{color:#8FCB78}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-weight:600;font-size:16px;line-height:1.35}
.wrap{max-width:480px;margin:0 auto;padding-bottom:96px}
.hd{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;line-height:1}
header{background:var(--ink);color:var(--paper);padding:14px 16px;display:flex;align-items:center;gap:12px}
header .k{font-size:15px;letter-spacing:.1em;font-weight:700;color:var(--gold)}
header h1{margin:2px 0 0;font-size:38px}
main{padding:12px 16px 0;display:flex;flex-direction:column;gap:12px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #3B5BA9;outline-offset:2px}
.back{width:46px;height:46px;flex-shrink:0;border-radius:8px;background:transparent;border:2.5px solid var(--paper);color:var(--paper);font-size:26px;line-height:1}
.search{width:100%;height:50px;padding:0 14px;border:3px solid var(--ink);border-radius:8px;background:var(--white);font-size:17px;box-shadow:4px 4px 0 var(--shadow)}
.lbl{font-size:14px;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 12px;border:2.5px solid var(--ink);border-radius:6px;background:var(--card);font-size:17px;letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.p{background:var(--brickd);color:#fff}
.chip.s{background:repeating-linear-gradient(45deg,#F6D5C8 0 5px,#F0C2B1 5px 7px)}
.chip.off{border-style:dashed;color:var(--muted);background:transparent;cursor:default}
.chip small{font-family:Barlow,system-ui,sans-serif;text-transform:none;font-weight:600;font-size:12px;letter-spacing:0}
.row2{display:flex;gap:8px}
.row2 select{flex:1;min-width:0;height:46px;border:2.5px solid var(--ink);border-radius:6px;background:var(--card);padding:0 8px;font-size:15px}
.count{display:flex;justify-content:space-between;align-items:baseline}
.count b{font-size:22px}
.ex{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--shadow);padding:10px 12px}
.ex h2{margin:0;font-size:25px}
.ex .m1{font-size:15px;color:var(--brickd);font-weight:700}
.ex .m2{font-size:14px;color:var(--muted)}
.tag{font-size:14px;letter-spacing:.05em;padding:2px 7px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);white-space:nowrap}
.tag.g{background:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.list{display:flex;flex-direction:column;gap:12px}
.gh{margin:6px 0 -2px;font-size:22px}

.ex.pic{display:flex;flex-direction:row;align-items:center;gap:12px}
.ex .th{flex:0 0 76px;width:76px;box-sizing:border-box;background:#E9DFCF;border:2px solid #1A1A1A;border-radius:6px;padding:5px 4px 1px;line-height:0}
.ex .th svg{width:100%;height:auto;display:block}
.ex .tx{flex:1;min-width:0;display:block}
.mpic{background:#E9DFCF;border:3px solid #1A1A1A;border-radius:8px;box-shadow:4px 4px 0 var(--shadow);padding:14px 12px 8px;display:flex;justify-content:center}
.mpic svg{width:100%;max-width:300px;height:auto;display:block}

.pbtn{flex-shrink:0;min-height:44px;padding:0 12px;border:2.5px solid var(--paper);border-radius:6px;background:transparent;color:var(--paper);font-size:17px;letter-spacing:.04em}
#mykit{align-self:flex-start}
#mykit.on{background:var(--ink);color:var(--paper)}
#onb{padding:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;gap:0}
#onb[hidden]{display:none}
.stage2{background:var(--tile);border-bottom:3px solid var(--ink);padding:12px 16px 0;display:flex;align-items:flex-end;gap:10px;height:206px}
.stage2 .fig{flex:0 0 auto;height:182px;line-height:0}
.stage2 .fig svg{height:100%;width:auto;display:block}
.stage2 .tx{flex:1;min-width:0;align-self:center;display:flex;flex-direction:column;gap:8px}
.stage2 h1{margin:0;font-size:32px;line-height:.95}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:5px;border:1.5px solid var(--ink);background:var(--line)}
.dots i.d{background:var(--ink)}
.dots i.c{width:26px;background:var(--gold)}
.bub{background:var(--white);border:2.5px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:15px;line-height:1.25}
.ob{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.onav{position:sticky;bottom:0;display:flex;gap:12px;padding:12px 16px 18px;background:var(--paper);border-top:2px solid var(--line)}
.big{min-height:52px;border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--shadow);font-size:20px;letter-spacing:.04em;background:var(--card);padding:0 14px}
.big.go{flex:1;background:var(--brickd);color:#fff}
.pick{display:flex;align-items:flex-end;gap:12px;height:150px;padding:8px 14px 0 10px;background:var(--card);border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--shadow);text-align:left}
.pick .fig{height:136px;line-height:0;flex-shrink:0}
.pick .fig svg{height:100%;width:auto;display:block}
.pick .tx{flex:1;align-self:center}
.pick b{font-size:26px;display:block}
.pick small{font-size:14px;color:var(--muted);font-weight:600;text-transform:none;font-family:Barlow,system-ui,sans-serif}
.sel{background:var(--sel)!important}
.tk{width:24px;height:24px;flex-shrink:0;border:2.5px solid var(--ink);border-radius:5px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:17px;align-self:center}
.sel>.tk,.tk.on{background:var(--gold)}
.fld{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fld .in{display:flex;align-items:center;background:var(--white);border:2.5px solid var(--ink);border-radius:6px;padding:0 10px;min-height:46px}
.fld input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:18px;font-weight:700;padding:0;font-family:inherit;color:inherit;min-height:40px}
.fld input[type=date]{font-size:16px}
.fld .in span{color:var(--muted);padding-left:6px}
.fld .in:focus-within{outline:3px solid var(--gold)}
.frow{display:flex;gap:12px}
.opts{display:flex;gap:6px}
.opts.wrap{flex-wrap:wrap}
.opt{flex:1 1 0;min-width:0;min-height:46px;border:2.5px solid var(--ink);border-radius:6px;background:var(--card);font-size:17px;white-space:nowrap;padding:0 10px}
.opts.wrap .opt{flex:0 0 auto}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.opt.sore[aria-pressed="true"]{background:var(--brickd);color:#fff}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal{position:relative;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--shadow);padding:10px 12px;min-height:74px}
.goal b{font-size:21px;display:block;padding-right:28px}
.goal small,.expo small{font-size:13px;color:var(--muted);font-weight:600;text-transform:none;font-family:Barlow,system-ui,sans-serif;letter-spacing:0}
.goal .tk{position:absolute;top:8px;right:8px}
.expo{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:7px;padding:8px 12px;min-height:48px}
.expo span.t{flex:1}
.expo b{font-size:19px}
.dash{background:var(--card);border:2.5px dashed var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.3;color:var(--muted)}
.krow{display:flex;align-items:center;gap:10px;width:100%;padding:6px 0;border:0;border-bottom:1.5px solid var(--line);background:transparent;text-align:left;min-height:52px}
.krow.off{opacity:.55}
.krow .th{flex:0 0 58px;width:58px;background:var(--tile);border:2px solid var(--ink);border-radius:5px;padding:3px 3px 1px;line-height:0}
.krow .th svg{width:100%;height:auto;display:block}
.krow .nm{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kgh{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.kgh h3{margin:0;font-size:20px}
.kgh button{border:0;background:transparent;color:var(--brickd);font-size:15px;min-height:44px;padding:0 4px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1.5px solid var(--line)}
.srow div{flex:1;min-width:0}
.srow b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow button{min-height:44px;padding:0 12px;border:2px solid var(--ink);border-radius:6px;background:var(--card);font-size:15px}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:3px solid var(--ink)}
#tabs[hidden]{display:none}
#tabs{gap:5px;padding-left:8px;padding-right:8px}
#tabs button{flex:1;min-width:0;max-width:130px;font-size:15px!important;letter-spacing:0!important;padding:0 1px;overflow:hidden;min-height:48px;border:2.5px solid var(--ink);border-radius:8px;background:var(--card);font-size:19px;letter-spacing:.05em}
#tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
#sheet[hidden]{display:none}
.shbg{position:absolute;inset:0;background:rgba(26,26,26,.5)}
.shbox{position:relative;max-width:480px;width:100%;margin:0 auto;box-sizing:border-box;max-height:86vh;overflow:auto;background:var(--paper);border-top:3px solid var(--ink);border-radius:16px 16px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}
.shbox h2{margin:0;font-size:26px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sbtn{text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:7px;padding:9px 12px;min-height:48px;display:flex;flex-direction:column;gap:1px}
.sbtn[hidden]{display:none}
.sbtn b{font-size:19px}
.sbtn small{font-size:13px;color:var(--muted);font-weight:600;line-height:1.25}
.pklist{display:flex;flex-direction:column;gap:7px}
.spl{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--shadow);padding:9px 12px}
.spl .t{flex:1;min-width:0}
.spl b{font-size:21px}
.spl small{display:block;font-size:13px;color:var(--muted);font-weight:600;text-transform:none;font-family:Barlow,system-ui,sans-serif;letter-spacing:0;line-height:1.25;margin-top:2px}
.spl small.dl{color:var(--ink)}
.wk{display:flex;gap:5px}
.wc{flex:1;min-width:0;min-height:52px;padding:4px 0 5px;border:2.5px solid var(--ink);border-radius:7px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.wc small{font-size:12px;color:var(--muted)}
.wc b{font-size:18px;min-height:19px}
.wc.rest{border-style:dashed;border-color:var(--line);background:transparent}
.wc.done{background:var(--ok)}
.wc.missed{background:var(--miss)}
.wc.today{background:var(--gold)}
.wc.now{outline:3px solid var(--ink);outline-offset:1px}
.banner{text-align:left;background:var(--sel);border:2.5px solid var(--ink);border-radius:7px;padding:9px 11px;font-size:14px;line-height:1.3;font-weight:600}
.pday{background:var(--card);border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--shadow)}
.ph{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:transparent;border:0;text-align:left;min-height:56px}
.ptag{font-size:14px;padding:5px 7px;border:2px solid var(--ink);border-radius:5px;background:var(--ink);color:var(--paper);white-space:nowrap}
.ptag.nx{background:var(--gold);color:var(--ink)}
.ptag.dn{background:#4E7A3A}
.ptag.sk{background:var(--muted)}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt small{font-size:13px;color:var(--muted);font-weight:600}
.pm{font-size:16px;white-space:nowrap}
.pb{border-top:1.5px solid var(--line);padding:6px 12px 10px;display:flex;flex-direction:column}
.pex{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:40px;padding:2px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:15px;font-weight:600}
.pex .r{color:var(--muted);white-space:nowrap}
.pex em{font-style:normal;font-size:12px;color:var(--brickd);border:1.5px solid var(--brickd);border-radius:4px;padding:0 4px}
.pxl{font-size:13.5px;color:var(--muted);padding:5px 0}
.prow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.heat{display:flex;gap:10px;align-items:center}
.hfig{display:flex;gap:4px;flex-shrink:0;background:var(--tile);border:2px solid var(--ink);border-radius:6px;padding:6px 4px 2px}
.hfig svg{height:150px;width:auto;display:block}
.hbars{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hbar{display:flex;align-items:center;gap:6px}
.hbar span{width:76px;font-size:14px;white-space:nowrap;overflow:hidden}
.hbar i{flex:1;height:13px;background:var(--white);border:2px solid var(--ink);border-radius:5px;overflow:hidden}
.hbar u{display:block;height:100%;border-right:2px solid var(--ink)}
.hbar b{width:22px;text-align:right;font-size:14px}
.hleg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px}
.hleg span{display:flex;align-items:center;gap:4px}
.hleg i{width:15px;height:15px;border:2px solid var(--ink);border-radius:4px}
.opt.xt{display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;padding:0 2px;overflow:hidden}
.opt.xt[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.opt.xt .tk{width:20px;height:20px;font-size:14px}
.erow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1.5px solid var(--line)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:40px;height:30px;border:2px solid var(--ink);border-radius:5px;background:var(--card);font-size:12px}
.mv button:disabled{opacity:.3}
.en{flex:1;min-width:0}
.en b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{display:flex;align-items:center;gap:5px;margin-top:4px}
.sr button{width:36px;height:36px;border:2px solid var(--ink);border-radius:5px;background:var(--card);font-size:20px}
.sr span{font-size:15px;white-space:nowrap}
.sr .reps{flex:1;min-width:0;width:60px;height:36px;border:2px solid var(--ink);border-radius:5px;background:var(--white);font-size:15px;font-weight:700;padding:0 6px;font-family:inherit}
.ea{display:flex;flex-direction:column;gap:4px}
.ea .chip{min-height:36px;font-size:14px;justify-content:center}
.chip.rm{color:var(--brickd)}
.addex{min-height:48px;border:2.5px dashed var(--ink);border-radius:7px;background:transparent;font-size:17px}
.fld select{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:700;min-height:40px;font-family:inherit;color:inherit}

#today,#work{min-height:calc(100vh - 170px)}
#work{min-height:calc(100dvh - 80px)}
.tprev{font-size:13.5px;color:var(--ink);margin-top:6px;line-height:1.35}
.winfo{display:flex;gap:10px;align-items:center}
.winfo .th{flex:0 0 86px;width:86px;background:var(--tile);border:2px solid var(--ink);border-radius:6px;padding:4px 3px 1px;line-height:0}
.winfo .th svg{width:100%;height:auto;display:block}
.winfo b{font-size:17px}
.lnk{border:0;background:transparent;color:var(--brickd);font-size:15px;padding:0;min-height:32px}
.wrow{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:6px 8px;border:2.5px solid var(--ink);border-radius:7px;background:var(--card);text-align:left;color:var(--ink)}
.wrow.dn{background:var(--ok)}
.wrow.td{opacity:.6}
.wrow small{font-size:15px;color:var(--muted);width:46px}
.wrow b{flex:1;font-size:20px}
.wrow b i{font-style:normal;color:var(--muted)}
.wrow.dn .tk{background:#4E7A3A;color:#fff}
.wcur{background:var(--sel);border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px}
.wst{display:flex;gap:8px}
.stp{flex:1;min-width:0;display:flex;align-items:stretch;border:3px solid var(--ink);border-radius:8px;background:var(--white);overflow:hidden}
.stp button{width:46px;min-height:56px;flex-shrink:0;border:0;background:var(--card);font-size:28px}
.stp button:first-child{border-right:2.5px solid var(--ink)}
.stp button:last-child{border-left:2.5px solid var(--ink)}
.stp label{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.big.nv{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stats{display:flex;gap:10px}
.st{flex:1;min-width:0;background:var(--card);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--shadow);padding:8px 10px}
.st b{display:block;font-size:30px}
.st small{font-size:12.5px;color:var(--muted);line-height:1.2;display:block;margin-top:2px}
.st.gr{background:var(--ok)}
.st.go{background:var(--sel)}
.prr{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:6px 0;border:0;border-bottom:1.5px solid var(--line);background:transparent;text-align:left;color:var(--ink)}
.prr:last-child{border-bottom:0}
.prr .t{flex:1;min-width:0;display:flex;flex-direction:column}
.prr .t b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prr small{font-size:12.5px;color:var(--muted);font-weight:600}
.prr .v{font-size:18px;white-space:nowrap}
.prr .tag{font-size:12px}
.phg{display:flex;gap:8px}
.phg.all{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.pht{flex:1;min-width:0;max-width:33%;position:relative;padding:0;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--tile);aspect-ratio:3/4}

.cmp{display:flex;gap:8px}
.cmp figure{flex:1;min-width:0;margin:0}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border:2.5px solid var(--ink);border-radius:6px}
.cmp figcaption{font-size:14px;text-align:center;margin-top:4px}
.hset{display:flex;align-items:center;gap:6px}
.hset small{width:46px;font-size:14px;color:var(--muted)}

.hset input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:17px;font-weight:700;font-family:inherit;color:inherit}
.hset span{font-size:13px;color:var(--muted)}
.hset i{font-style:normal;color:var(--muted)}
.rmx{width:40px;height:40px;border:2px solid var(--ink);border-radius:5px;background:var(--card);color:var(--brickd);font-size:20px}
#prog{min-height:calc(100vh - 170px)}

.ovb span{margin-left:auto;font-size:20px}

.ovr.dn{background:var(--ok)}
.ovr.cur{box-shadow:4px 4px 0 var(--shadow);background:var(--sel)}
.ovr.cur.dn{background:var(--ok)}
.go2{flex:1;min-width:0;min-height:56px;border:0;background:transparent;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;padding:0}

.go2 small{font-size:12.5px;color:var(--muted);font-weight:600}
.dots2{display:flex;gap:4px;margin-top:2px}
.dots2 i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.dots2 i.d{background:#4E7A3A}

.vsr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1.5px solid var(--line)}
.vsr:last-child{border-bottom:0}
.vsr .n{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsr small{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.vsr .ar{width:16px;text-align:center;font-size:14px;color:var(--muted)}
.vsr .ar.u{color:#4E7A3A}
.vsr .ar.d{color:var(--brickd)}
.vsr .v{font-size:18px;white-space:nowrap;min-width:70px;text-align:right}
.vsr .v i{font-style:normal;color:var(--golddk,#DE9C12)}
.bshelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.bdg{border:0;background:transparent;padding:0 6px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px}
.bdg svg{max-width:62px}
.bdg small{font-size:12.5px;line-height:1.05;text-align:center}
.recap{background:var(--sel)}

/* ---- motion: short and quiet. Everything is off when the phone asks for reduced motion. */
@media (prefers-reduced-motion: no-preference){
button,.chip,.opt,.ex,.big,.sbtn{transition:transform .07s ease-out,box-shadow .07s ease-out}
.big:active,.ex:active,.pick:active,.goal:active,.spl:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.chip:active,.opt:active,.sbtn:active,.wc:active,.stp button:active,#tabs button:active,.pbtn:active,.sr button:active,.mv button:active{transform:scale(.96)}
main.enter{animation:fadeup .16s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#sheet:not([hidden]) .shbox{animation:sheetup .18s cubic-bezier(.2,.8,.3,1) both}
#sheet:not([hidden]) .shbg{animation:fadein .18s ease-out both}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

svg.coach .chead{animation:nod 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes nod{0%,100%{translate:0 0}50%{translate:0 1.2px}}
main.enter .fig{animation:coachin .26s cubic-bezier(.3,1.4,.5,1) both;transform-origin:50% 100%}
@keyframes coachin{from{transform:scale(.9) translateY(8px);opacity:0}to{transform:none;opacity:1}}
#work.enter .wcoach .fig{animation:hop .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes hop{0%{transform:translateY(10px) scale(.92);opacity:0}45%{transform:translateY(-8px);opacity:1}100%{transform:none}}
main.enter .bub{animation:bubin .22s .1s cubic-bezier(.3,1.3,.5,1) both;transform-origin:0 50%}
@keyframes bubin{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.wrow.pop{animation:rowin .22s ease-out}
.wrow.pop .tk{animation:tick .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes rowin{from{background:var(--white)}to{background:var(--ok)}}
@keyframes tick{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.stp input.bump{animation:bump .12s ease-out}

main.enter .hbar u,main.enter .dots i.c{animation:grow .35s .08s ease-out both;transform-origin:0 50%}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
#work.enter .vsr{animation:fadeup .2s ease-out both}

/* ---- tap targets: at least 44 px tall where the layout allows */
.lnk{min-height:44px;padding:0 4px;display:inline-flex;align-items:center}

.legend{display:flex;gap:16px;font-size:15px;letter-spacing:.06em}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:18px;height:18px;border:2px solid var(--ink);border-radius:3px}

const D = {"MUSCLES":{"neck":["Neck","Turns, tilts and holds up the head."],"traps-upper":["Traps, upper","Shrug the shoulders up and help turn the shoulder blade when you lift your arm."],"traps-mid":["Traps, middle","Squeeze the shoulder blades together, as in rows."],"traps-lower":["Traps, lower","Pull the shoulder blades down and help rotate them when you reach overhead."],"delt-front":["Front delt","Raises the arm forward and helps in every press."],"delt-side":["Side delt","Lifts the arm out to the side. Gives the shoulder its width."],"delt-rear":["Rear delt","Pulls the arm backward and out, as in reverse flys and face pulls."],"chest-upper":["Chest, upper","Lifts the arm forward, up and across the body. Works hardest on incline presses. (Clavicular head of pectoralis major.)"],"chest-mid-lower":["Chest, mid and lower","Pushes the arm forward and pulls it across and down. The main bench press muscle. (Sternocostal head of pectoralis major.)"],"serratus-anterior":["Serratus anterior","Pulls the shoulder blade forward around the ribs, as at the end of a punch or push-up."],"abs-upper":["Abs, upper","Curls the ribcage toward the hips, as in crunches. Upper and lower abs are one muscle (rectus abdominis); the split shows which end is moving."],"abs-lower":["Abs, lower","Curls the pelvis toward the ribs, as in leg raises. Same muscle as the upper abs."],"obliques":["Obliques","Twist and side-bend the trunk and brace the waist."],"lats":["Lats","Pull the arm down and back, as in pull-ups and rows. They make the back wide. (Latissimus dorsi.)"],"rhomboids":["Rhomboids","Pull the shoulder blades back toward the spine. They sit under the middle traps."],"rotator-cuff":["Rotator cuff","Turns the arm outward and keeps the shoulder joint steady. (Infraspinatus and teres minor.)"],"teres-major":["Teres major","Helps the lats pull the arm down and back, and turns it inward."],"erector-spinae":["Spinal erectors","Straighten the back and hold it rigid in squats and deadlifts."],"biceps-long":["Biceps, long head","Bends the elbow and turns the palm up. The outer head, which forms the peak."],"biceps-short":["Biceps, short head","Bends the elbow and turns the palm up. The inner head."],"brachialis":["Brachialis","A pure elbow bender under the biceps. Works in every curl, most in hammer and reverse curls."],"brachioradialis":["Brachioradialis","Bends the elbow, strongest with a thumbs-up grip such as hammer curls."],"forearm-flexors":["Forearm flexors","Curl the wrist and close the hand. Your grip."],"forearm-extensors":["Forearm extensors","Bend the wrist back and open the hand."],"triceps-long":["Triceps, long head","Straightens the elbow and helps pull the arm back. The biggest head, on the inner back of the arm."],"triceps-lateral":["Triceps, lateral head","Straightens the elbow. The outer part of the horseshoe."],"triceps-medial":["Triceps, medial head","Straightens the elbow. Mostly deep; it shows just above the elbow."],"hip-flexors":["Hip flexors","Lift the thigh toward the body. Mostly deep, so only a small patch shows at the hip. (Iliopsoas.)"],"glute-max":["Glutes, maximus","Drives the hip straight in squats, deadlifts and hip thrusts."],"glute-med-min":["Glutes, medius and minimus","Lift the leg out to the side and keep the pelvis level when you stand on one leg. The hip abductors."],"adductors":["Adductors","Pull the legs together and help in squats and deadlifts. The inner thigh."],"quad-rectus-femoris":["Quads, rectus femoris","Straightens the knee and helps lift the thigh. The middle quad."],"quad-vastus-lateralis":["Quads, vastus lateralis","Straightens the knee. The outer sweep of the thigh."],"quad-vastus-medialis":["Quads, vastus medialis","Straightens the knee. The teardrop above the inner knee."],"hamstring-biceps-femoris":["Hamstrings, biceps femoris","Bends the knee and helps straighten the hip. The outer hamstring."],"hamstring-semis":["Hamstrings, inner","Bend the knee and help straighten the hip. (Semitendinosus s. Also held for weighted sit-ups, back extensions and carries.","Common sizes: 1.25, 2.5, 5, 10, 15, 20 and 25 kg.\nSlide plates fully on and secure with collars.\nLift plates with bent knees and a flat back.","Use the smallest plates to make small jumps.","Dumbbells; kettlebells","Commercial gym; home gym","plates"],["Dumbbells","Free weight","One weight in each hand for presses, rows, curls, raises, lunges and more. Each side works on its own.","Pick them up and put them down with bent knees.\nKeep wrists straight.\nRe-rack in the right place.","Pick a weight you can lift 12 times with about 3 reps left in the tank. If the last rep is a grind, go lighter.","Kettlebells; resistance bands; barbell","Commercial gym; home gym","dumbbells"],["Kettlebells","Free weight","Swings, goblet squats, carries and presses. The offset handle suits hip-driven moves.","Give yourself clear space in front and behind for swings.\nKeep the wrist straight when pressing.","For goblet squats, pick a weight you can lift 12 times with about 3 left. For swings, start light and learn the hip hinge first.","Dumbbell; resistance band","Commercial gym; home gym","kettlebells"],["Resistance bands","Band","Light, portable resistance for rows, presses, pull-aparts, face pulls and assisted pull-ups.","Check for nicks or tears before each use.\nAnchor to something solid and at the right height.\nResistance rises as the band stretches.","Choose a band that lets you do 12 to 15 reps with about 3 left. Step further away or double the band to make it harder.","Cable station; dumbbells","Home gym; commercial gym; outdoors","bands"],["Pull-up bar","Bodyweight","Pull-ups, chin-ups, hanging leg raises and dead hangs.","Check a doorway bar is secure before every session.\nUse a step if you cannot reach comfortably.\nLower yourself with control; do not drop.","If you cannot yet do 5 reps, use a band for help, or do slow lowering reps.","Lat pulldown; assisted pull-up machine; inverted row","Commercial gym; home gym; outdoors","pullup-bar"],["Dip bars","Bodyweight","Dips for chest and triceps; also knee raises and support holds.","Shoulders stay down, away from the ears.\nOnly go as low as your shoulders are comfortable with.","If you cannot yet do 5 reps, use the assisted machine, a band, or bench dips.","Seated dip machine; bench dip; close-grip push-up","Commercial gym; outdoors","dip-bars"],["Suspension trainer or rings","Bodyweight","Rows, push-ups, fallouts and assisted squats using your own bodyweight at an adjustable angle.","Anchor to something that can take your full weight.\nThe more upright you stand, the easier it is.\nKeep the straps tight throughout.","Pick a body angle that lets you do 10 to 12 reps with about 3 left. Walk your feet forward to make rows harder.","Inverted row on a bar; resistance bands","Home gym; commercial gym; outdoors","suspension"],["Exercise mat","Accessory","Padding for floor work: planks, crunches, glute bridges, stretches.","Use on a flat, non-slip floor.","Not applicable.","Carpet or a folded towel","Home gym; commercial gym","mat"],["Ab wheel","Accessory","Roll-outs for the abs, done from the knees.","Kneel on a mat.\nOnly roll as far as you can without your lower back sagging.","Start with short roll-outs from the knees: 5 to 8 controlled reps.","Plank; dead bug; stability-ball roll-out","Home gym; commercial gym","ab-wheel"],["Step or box","Accessory","Step-ups, calf raises, box squats, incline and decline push-ups.","Check it is stable and on a non-slip surface.\nStep down; do not jump down, to begin with.","Start with a low height (about knee height or lower).","A sturdy stair or bench","Commercial gym; home gym","step-box"],["Treadmill","Cardio","Walking and running indoors. Raising the incline makes walking harder without running.","Clip on the safety key.\nStart the belt slowly and straddle it if you need to stop quickly.","Begin at a pace where you can still talk in short sentences. Add time before speed.","Outdoor walk or run; cross-trainer","Commercial gym; home gym","treadmill"],["Exercise bike","Cardio","Low-impact cardio that is easy on the knees and ankles.","Seat height: knee slightly bent at the bottom of the pedal stroke.\nHandlebars within easy reach.","Begin at a resistance where you can still talk in short sentences. Add time before resistance.","Outdoor cycling; cross-trainer","Commercial gym; home gym","bike"],["Rowing machine","Cardio","Full-body cardio: legs push first, then the back, then the arms.","Strap the feet across the widest part of the foot.\nOrder on the pull: legs, lean back, arms. Reverse it on the way in.\nKeep the back flat.","Row easily for 5 minutes at a pace where you can talk. A damper setting of 3 to 5 suits most people.","Cross-trainer; bike; kettlebell swings","Commercial gym; some home gyms","rower"],["Cross-trainer (elliptical)","Cardio","Low-impact cardio for arms and legs together.","Stand tall and hold the moving handles.\nKeep your whole foot on the pedal.","Begin at a resistance where you can still talk in short sentences. Add time before resistance.","Bike; brisk walk","Commercial gym","cross-trainer"],["Stair climber","Cardio","Steady climbing for legs, glutes and lungs.","Hold the rails lightly for balance; do not lean your weight on them.\nStep with the whole foot.","Start at a slow level for 5 minutes and build from there.","Step-ups on a box; incline treadmill walk","Commercial gym","stair-climber"],["Skipping rope","Cardio","Quick cardio and footwork that needs very little space.","Rope length: handles reach your armpits when you stand on the middle.\nSmall jumps, turning from the wrists.","Try 30 seconds on, 30 seconds off, for 5 rounds.","Jogging on the spot; step-ups","Home gym; commercial gym; outdoors","skipping-rope"]];
